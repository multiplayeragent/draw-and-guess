<script>
/* ═══ DRAW & GUESS · a Multiplayer Agent starter ═════════════════════════════════════════
 * One player draws. Everyone else guesses. Party, 3–10 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ timers, scoring, bots
 *   WORDS ......... the word list and the bots' doodles (simple line drawings, one per word)
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SEALED SECRETS  the Seal helper: the word is encrypted so only the drawer can read it
 *   INK ........... how a drawing is packed into short strings and drawn back
 *   GAME (HOST) ... turns, picking the drawer and the word, hints, checking guesses, scores, bots
 *   ME ............ drawing (when it's my turn), guessing, opening my word
 *   SCREEN ........ word bar, board, players, chat, results, leaderboard
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The game lives in ONE shared field, `game`: {id, v, ph, order, ti, dr, at, endsAt, mask,
 *     got, scores, word, bots}. Only the HOST writes it (`v` goes up on every write). The host
 *     is the lowest sessionId among live players (heartbeat seen in the last 3s).
 *   - The WORD is hidden: the host seals it to the drawer's key in the shared `secret` field,
 *     so only the drawer can open it (the host picks it, so it knows it too). Everyone else
 *     sees `mask`: blanks, plus the letters the host reveals as time runs out.
 *   - The drawer writes its drawing into its OWN entity: d0…d7, each a packed string under
 *     2048 characters. A bot's drawing goes in shared fields b0…b7 the same way.
 *   - Guesses are intents: every chat line is sent to the host sealed ("guess"), so nobody
 *     can read a right answer on the wire. The host scores right ones by time, and writes
 *     wrong ones to the shared `chat` field for everyone to see.
 *   - A new host doesn't know the word: the drawer re-sends it, sealed ("word"). If the drawer
 *     was a bot or left, that turn ends early and the game goes on.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "draw-points": each player's best game.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 4,             // bots fill the room up to this many players
  maxPlayers: 10,
  rounds: 1,            // each player draws this many times per game
  turnMs: 60000,        // drawing time per turn
  revealMs: 5000,       // the word shows between turns
  lobbyMs: 6000,        // countdown before a game
  resultsMs: 15000,     // the results screen
  hintAt: [0.45, 0.65, 0.8], // share of the turn gone when another letter shows (at most half the letters)
  maxPoints: 500,       // a right guess at once…
  minPoints: 100,       // …down to this at the buzzer
  drawerPoints: 80,     // the drawer gets this for every right guess
  chatLines: 12,        // chat lines kept in state
  inkChunks: 8,         // fields a drawing may use (each under 2048 characters)
  pen: 7,               // pen width on the 800×600 board
  botSkill: 0.7,        // chance a bot gets the word this turn
  botGuessAt: [0.25, 0.85], // when in the turn a bot guesses right (share of the turn)
  botDrawShare: 0.55,   // a bot finishes its doodle in this share of the turn
  board: "draw-points", // leaderboard name
};
const BOT_NAMES = ["Doodles", "Picasso", "Scribbles", "Crayon", "Inky", "Sketch", "Pencil", "Mona"];
const COLORS = ["#ff5a6e", "#3d8bff", "#1fae6a", "#ff9f1c", "#9b5de5", "#00b8b0", "#f15bb5", "#7a8b00", "#e76f51", "#4361ee"];

// ── WORDS ───────────────────────────────────────────────────────────────────────────
// The bots draw these doodles. Each is a list of strokes in a 0–100 box, built from:
// L = a line through x,y pairs, C = circle, E = ellipse, A = arc (angles in radians), R = rectangle.
const PI = Math.PI;
const L = (...n) => { const p = []; for (let i = 0; i < n.length; i += 2) p.push([n[i], n[i + 1]]); return p; };
const A = (cx, cy, rx, ry, a0, a1) => Array.from({ length: 19 }, (_, i) => { const a = a0 + ((a1 - a0) * i) / 18; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; });
const C = (cx, cy, r) => A(cx, cy, r, r, 0, PI * 2);
const E = (cx, cy, rx, ry) => A(cx, cy, rx, ry, 0, PI * 2);
const R = (x, y, w, h) => L(x, y, x + w, y, x + w, y + h, x, y + h, x, y);
const DOODLES = {
  sun: [C(50, 50, 18), L(50, 25, 50, 8), L(50, 75, 50, 92), L(25, 50, 8, 50), L(75, 50, 92, 50), L(32, 32, 20, 20), L(68, 32, 80, 20), L(32, 68, 20, 80), L(68, 68, 80, 80)],
  house: [R(24, 46, 52, 42), L(16, 50, 50, 18, 84, 50), R(44, 64, 14, 24), R(29, 54, 10, 10), R(61, 54, 10, 10)],
  tree: [L(45, 92, 46, 64), L(55, 92, 54, 64), C(50, 42, 24), A(44, 38, 9, 9, PI, PI * 1.6)],
  cat: [C(50, 58, 22), L(33, 46, 30, 24, 45, 38), L(55, 38, 70, 24, 67, 46), C(42, 54, 2.5), C(58, 54, 2.5), L(47, 62, 53, 62, 50, 66, 47, 62), L(30, 62, 12, 58), L(30, 66, 12, 70), L(70, 62, 88, 58), L(70, 66, 88, 70)],
  fish: [E(44, 50, 28, 16), L(70, 50, 90, 34, 90, 66, 70, 50), C(28, 46, 3), A(46, 50, 8, 14, -PI / 2, PI / 2)],
  car: [L(8, 64, 8, 50, 24, 46, 34, 30, 66, 30, 76, 46, 92, 50, 92, 64, 8, 64), C(28, 66, 9), C(72, 66, 9), L(50, 30, 50, 46), L(30, 46, 76, 46)],
  flower: [C(50, 32, 7), C(50, 17, 8), C(65, 32, 8), C(50, 47, 8), C(35, 32, 8), L(50, 55, 50, 92), L(50, 76, 66, 64, 52, 70)],
  apple: [C(50, 58, 28), L(50, 30, 52, 14), L(54, 24, 68, 16, 62, 28, 54, 24)],
  star: [L(50, 8, 62, 38, 94, 38, 68, 58, 78, 90, 50, 70, 22, 90, 32, 58, 6, 38, 38, 38, 50, 8)],
  boat: [L(10, 60, 90, 60, 76, 80, 24, 80, 10, 60), L(50, 60, 50, 10), L(52, 14, 82, 54, 52, 54)],
  heart: [L(50, 84, 18, 52, 12, 34, 22, 20, 38, 18, 50, 32, 62, 18, 78, 20, 88, 34, 82, 52, 50, 84)],
  moon: [[...A(50, 50, 32, 32, PI / 2, PI * 1.5), ...A(62, 50, 34, 34, -1.93, -4.35)], C(40, 40, 3), C(36, 60, 4)],
  cloud: [A(32, 56, 14, 14, PI / 2, PI * 1.5), A(52, 42, 20, 20, PI * 1.05, PI * 1.95), A(70, 54, 14, 14, -PI / 2, PI / 2), L(70, 68, 32, 70)],
  snowman: [C(50, 70, 20), C(50, 38, 13), C(45, 35, 1.8), C(55, 35, 1.8), L(50, 39, 61, 41, 50, 43), L(34, 64, 18, 50), L(66, 64, 82, 50), L(38, 26, 62, 26), R(42, 12, 16, 14)],
  umbrella: [[...A(50, 50, 38, 34, PI, PI * 2), ...L(88, 50, 75, 46, 63, 50, 50, 46, 37, 50, 25, 46, 12, 50)], L(50, 48, 50, 84, 44, 90, 38, 84)],
  rocket: [L(50, 8, 64, 30, 64, 72, 36, 72, 36, 30, 50, 8), C(50, 42, 6), L(36, 56, 24, 76, 36, 72), L(64, 56, 76, 76, 64, 72), L(44, 74, 50, 92, 56, 74)],
  ghost: [[...L(28, 86, 28, 42), ...A(50, 42, 22, 22, PI, PI * 2), ...L(72, 42, 72, 86, 65, 79, 58, 86, 50, 79, 42, 86, 35, 79, 28, 86)], C(42, 44, 3), C(58, 44, 3), E(50, 58, 4, 6)],
  key: [C(28, 50, 13), C(28, 50, 4), L(41, 50, 88, 50, 88, 62), L(74, 50, 74, 60)],
  glasses: [C(31, 52, 14), C(69, 52, 14), A(50, 53, 6, 4, PI, PI * 2), L(17, 48, 6, 40), L(83, 48, 94, 40)],
  "ice cream": [L(32, 48, 50, 92, 68, 48, 32, 48), A(50, 46, 19, 19, PI, PI * 2), L(38, 60, 58, 56), L(42, 70, 56, 66)],
  mushroom: [[...A(50, 52, 36, 30, PI, PI * 2), ...L(86, 52, 14, 52)], L(42, 52, 40, 86, 60, 86, 58, 52), C(38, 38, 5), C(60, 34, 6), C(72, 46, 3)],
  snail: [C(56, 50, 22), A(57, 51, 12, 12, 0, PI * 1.6), L(14, 72, 90, 72), L(22, 72, 18, 46), L(18, 46, 12, 36), L(18, 46, 24, 36)],
  cup: [L(28, 30, 32, 80, 64, 80, 68, 30, 28, 30), A(68, 54, 12, 14, -PI / 2, PI / 2), L(40, 24, 44, 16, 40, 8), L(54, 24, 58, 16, 54, 8)],
  balloon: [E(50, 38, 22, 27), L(50, 65, 46, 70, 54, 70, 50, 65), L(50, 70, 44, 80, 54, 88, 47, 96)],
  pizza: [L(14, 20, 86, 20, 50, 92, 14, 20), A(50, 20, 38, 8, PI, PI * 2), C(42, 34, 5), C(58, 42, 5), C(50, 60, 4)],
  spider: [C(50, 50, 12), C(50, 32, 7), L(40, 44, 22, 34, 14, 46), L(40, 50, 18, 50, 10, 62), L(42, 56, 24, 66, 18, 80), L(60, 44, 78, 34, 86, 46), L(60, 50, 82, 50, 90, 62), L(58, 56, 76, 66, 82, 80), L(50, 25, 50, 8)],
};
// People can also get these (no doodle, so the bots never draw them).
const MORE_WORDS = ["guitar", "robot", "castle", "dragon", "rainbow", "pirate", "volcano", "penguin", "banana", "bicycle", "crown", "octopus", "cactus", "kite",
  "lighthouse", "sandwich", "dinosaur", "butterfly", "camera", "candle", "anchor", "igloo", "pumpkin", "hamburger", "tent", "clock", "train", "bridge", "elephant"];
const WORDS = [...Object.keys(DOODLES), ...MORE_WORDS];
const SILLY = ["a blob?", "potato", "dog", "hmm…", "lamp", "a hat?", "spaghetti", "is it a bird", "ufo", "broccoli"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'draw-and-guess',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));
const pkOf = (id) => (id === net.sessionId ? Seal.pub : S.entities.players?.[id]?.pk);

// ── SEALED SECRETS ──────────────────────────────────────────────────────────────────
// Hidden info in a relay room. Everything in room state reaches every client, so a secret
// (the word to draw) is written SEALED: encrypted so only its one reader can open it. Each
// player publishes a public key in its own entity (`pk`); the host seals the word to the
// drawer's key and writes the box into the shared `secret` field.
//   - The host picks the word, so the host can read it. Fine for friends, not cheat-proof.
//   - A new host can't open boxes the old host sealed: the drawer re-sends its word to the
//     new host (sealed, with mp.send).
//   - crypto.subtle needs https or localhost. Without it seal()/open() pass the value through.
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const Seal = {
  pair: null,
  pub: "",
  keys: new Map(), // other player's public key -> derived AES key
  get on() { return !!(window.crypto && crypto.subtle); },
  /** Make this player's key pair. Returns the public key to publish: me.set("pk", pub). */
  async init() {
    if (!this.on) return "";
    this.pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    this.pub = b64(await crypto.subtle.exportKey("raw", this.pair.publicKey));
    return this.pub;
  },
  async key(otherPub) {
    let k = this.keys.get(otherPub);
    if (!k) {
      const theirs = await crypto.subtle.importKey("raw", unb64(otherPub), { name: "ECDH", namedCurve: "P-256" }, false, []);
      k = await crypto.subtle.deriveKey({ name: "ECDH", public: theirs }, this.pair.privateKey, { name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt"]);
      this.keys.set(otherPub, k);
    }
    return k;
  },
  /** Seal any JSON value so only the holder of `toPub` (and you) can open it. */
  async seal(toPub, value) {
    if (!this.on) return "p:" + JSON.stringify(value);
    if (!toPub || !this.pair) return ""; // never plaintext online: nobody can open an empty box
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.key(toPub), new TextEncoder().encode(JSON.stringify(value)));
    return b64(iv) + "." + b64(ct);
  },
  /** Open a box sealed by the player whose public key is `fromPub`. Null if it isn't for you. */
  async open(fromPub, box) {
    if (typeof box !== "string") return null;
    if (box.startsWith("p:")) return JSON.parse(box.slice(2));
    if (!this.on || !fromPub || !this.pair) return null;
    try {
      const [iv, ct] = box.split(".").map(unb64);
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, await this.key(fromPub), ct);
      return JSON.parse(new TextDecoder().decode(pt));
    } catch { return null; }
  },
};

// ── INK ─────────────────────────────────────────────────────────────────────────────
// A drawing is one string: "|" + color + width starts a stroke, then 4 characters per point
// (x and y on the 800×600 board, 2 characters each). It is split into chunks under 2048
// characters, each starting with "g<game>.<turn>.<clears>~" so old chunks are ignored.
const BW = 800, BH = 600, CHUNK = 1850, INK_COLORS = ["#2a2140"];
const ENC = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_", DEC = Object.fromEntries([...ENC].map((c, i) => [c, i]));

  if ($("word").innerHTML !== word) $("word").innerHTML = word;
  // the board
  if (g.ph === "turn" || g.ph === "reveal") drawBoard(g.dr === net.sessionId && mine.turn === turnKey(g) ? mine.ink : inkOf(g));
  else drawBoard("");
  $("tools").hidden = !iDraw(g);
  $("board").style.cursor = iDraw(g) ? "crosshair" : "default";
  let ban = "";
  if (g.ph === "lobby") ban = `Draw &amp; Guess<small>Take turns drawing a secret word. Guess fast for more points.<br>Starting in ${Math.ceil(left / 1000)}…</small>`;
  else if (g.ph === "turn" && t - g.at < (ATTRACT ? 900 : 2200)) ban = g.dr === net.sessionId && !ATTRACT ? "Your turn to draw!<small>Don't write the word. Draw it.</small>" : `${esc(drawer)} is drawing<small>Type your guesses below</small>`;
  else if (g.ph === "turn" && full() && iDraw(g)) ban = "Out of ink!<small>Clear to start over.</small>";
  else if (g.ph === "reveal") {
    const right = Object.entries(g.got).sort((a, b) => b[1] - a[1]).map(([id, p]) => `${esc(nameIn(g, id))} +${p}`).join(" · ");
    ban = g.why === "lost" ? "Turn skipped<small>The word left with the old host.</small>" : g.why === "left" ? `${esc(drawer)} left<small>On to the next drawer.</small>`
      : `${g.word ? "It was “" + esc(g.word) + "”" : "Time's up"}<small>${right || "Nobody got it."}</small>`;
  }
  if ($("banner").dataset.v !== ban) { $("banner").dataset.v = ban; $("banner").innerHTML = ban ? `<div>${ban}</div>` : ""; }
  // the players
  const ids = [...new Set([...g.order, ...humans()])].filter((id) => isBot(g, id) || S.entities.players?.[id]);
  const html = ids.map((id) => ({ id, s: g.scores[id] || 0 })).sort((a, b) => b.s - a.s).map(({ id, s }) =>
    `<div class="p ${id === net.sessionId ? "me" : ""} ${g.ph === "turn" && g.got[id] ? "got" : ""} ${g.ph === "turn" && g.dr === id ? "dr" : ""}"><span class="av" style="background:${esc(colorIn(g, id))}">${g.ph === "turn" && g.dr === id ? "✎" : g.ph === "turn" && g.got[id] ? "✓" : esc(nameIn(g, id)[0])}</span>${esc(nameIn(g, id))}<span class="s">${s}</span></div>`).join("");
  if ($("players").innerHTML !== html) $("players").innerHTML = html;
  // the chat
  const c = parse(S.shared.chat, { l: [] }), chatHtml = (c.g === g.id ? c.l : []).map(([n, col, text, kind]) =>
    kind === "sys" ? `<div class="sys">${esc(text)}</div>` : `<div class="${kind}"><b style="color:${esc(col)}">${esc(n)}</b>${esc(text)}</div>`).join("") || '<div class="sys">Guesses show up here.</div>';
  if ($("chat").dataset.v !== chatHtml) { $("chat").dataset.v = chatHtml; $("chat").innerHTML = chatHtml; $("chat").scrollTop = 1e6; }
  const canGuess = !(g.ph === "turn" && (g.dr === net.sessionId || g.got[net.sessionId]));
  $("guess").placeholder = !canGuess ? (g.dr === net.sessionId ? "You're drawing!" : "You got it! Wait for the others…") : g.ph === "turn" ? "Type your guess…" : "Say something…";
  $("guess").disabled = !canGuess; $("say").hidden = ATTRACT;
  renderOver(g);
}

let boardFor = -1, lb = null;
function renderOver(g) {
  $("over").hidden = g.ph !== "results";
  if (g.ph !== "results") return;
  const ranked = [...new Set([...g.order, ...Object.keys(g.scores)])].map((id) => ({ id, s: g.scores[id] || 0 })).sort((a, b) => b.s - a.s);
  $("oTitle").textContent = ranked[0] && ranked[0].s ? (ranked[0].id === net.sessionId ? "You win!" : `${nameIn(g, ranked[0].id)} wins!`) : "Game over";
  const html = ranked.map((r, i) => `<li style="${r.id === net.sessionId ? "font-weight:800" : ""}">${["🥇", "🥈", "🥉"][i] || ""} ${esc(nameIn(g, r.id))}<span>${r.s}</span></li>`).join("");
  if ($("ranks").innerHTML !== html) $("ranks").innerHTML = html;
  $("oNext").textContent = `Next game in ${Math.max(0, Math.ceil((g.endsAt - Date.now()) / 1000))}s`;
  $("again").textContent = g.ready.includes(net.sessionId) ? "Ready ✓" : "Play again";
  if (boardFor === g.id) return;
  boardFor = g.id;
  const list = $("board10"), score = g.scores[net.sessionId] || 0;
  if (!lb) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (score > 0 ? lb.submit(score).catch(() => null) : Promise.resolve()).then(() => lb.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No scores yet. Win one.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}

/** Two players picked one color (they joined at once): the later sessionId picks another. */
function fixColor() {
  const ps = S.entities.players || {};
  if (!Object.entries(ps).some(([id, p]) => id < net.sessionId && p.c === myColor)) return;
  const taken = new Set(Object.entries(ps).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || pick(COLORS);
  net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
board.addEventListener("pointerdown", (e) => { unlockAudio(); penDown(e); });
board.addEventListener("pointermove", penMove);
for (const ev of ["pointerup", "pointercancel"]) board.addEventListener(ev, penUp);
$("clear").addEventListener("click", clearBoard);
$("say").addEventListener("submit", (e) => {
  e.preventDefault(); unlockAudio();
  const text = $("guess").value.trim();
  $("guess").value = "";
  if (text) sendGuess(text);
});
$("again").addEventListener("click", () => { if (isHost()) onReady(net.sessionId); else net.send("ready", { r: 1 }); });
$("name").addEventListener("change", () => {
  myName = $("name").value.trim().slice(0, 14) || myName;
  try { localStorage.setItem("mpa-name", myName); } catch {}
  net && net.me.set("n", myName);
});
document.addEventListener("touchmove", (e) => { if (!e.target.closest("#chat, .card")) e.preventDefault(); }, { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastRender = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); }
  watchHost();
  if (isHost()) hostTick(); else host.was = false;
  const g = game();
  if (g) { myTick(g); effects(g); if (g.ph === "lobby") fixColor(); }
  if (now - lastRender > 80) { lastRender = now; render(g); }
  else if (g && g.dr === net.sessionId && mine.drawing) drawBoard(mine.ink); // my own pen, every frame
  drawFx(dt);
  requestAnimationFrame(frame);
}

(async function start() {
  if (ATTRACT) Object.assign(CONFIG, { lobbyMs: 300, turnMs: 9000, revealMs: 2600, resultsMs: 5000, botGuessAt: [0.35, 0.8], botSkill: 0.85, botDrawShare: 0.6, hintAt: [0.3, 0.55, 0.75] });
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  net.on("guess", async (msg, from) => { // sealed to the host: only the host can open it
    if (!msg || msg.to !== net.sessionId || !isHost()) return;
    const v = await Seal.open(pkOf(from), msg.box);
    if (v) onGuess(from, v.w);
  });
  net.on("word", async (msg, from) => { // the drawer's word, re-sent to a new host
    if (!msg || msg.to !== net.sessionId) return;
    const v = await Seal.open(pkOf(from), msg.box);
    if (!v) return;
    heardWord = v;
    const g = game();
    if (isHost() && g && g.ph === "turn" && g.dr === from && v.t === turnKey(g)) host.word = v.w;
  });
  net.on("who", (msg, from) => resendWord(from));
  net.on("ready", (msg, from) => { if (isHost()) onReady(from); });
  if (!net.offline && typeof MP !== "undefined") lb = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const pk = await Seal.init().catch(() => "");
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || pick(COLORS);
  $("name").value = myName;
  net.me.set({ n: myName, c: myColor, hb: Date.now(), pk });
  fit();
  requestAnimationFrame(frame);
})();
</script>
